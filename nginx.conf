# Mesmo comportamento do proxy do Vite em dev (vite.config.ts): /api/* -> backend, com o
# prefixo /api removido antes de encaminhar.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # F8 (auditoria de segurança) -- CSP restrita à origem própria + Keycloak (login, refresh de
    # token via XHR, e o iframe do silent renew, ver src/lib/auth.ts). style-src precisa de
    # 'unsafe-inline' pro style="" que React/recharts geram em runtime (não tem nonce/hash
    # praticável pra isso hoje). Strict-Transport-Security fica pendente -- só faz sentido depois
    # da decisão de TLS (B16), servir isso sem HTTPS de verdade não protege nada.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8180; frame-src http://localhost:8180; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resolver do Docker (127.0.0.11) + proxy_pass via variável: força resolução tardia (por
    # request), não na carga da config. Sem isso, o nginx recusa iniciar (e derruba os arquivos
    # estáticos, que nem dependem da API) se o serviço "api-confectionery" ainda não estiver
    # resolvível no boot -- achado ao testar a imagem isolada, fora da rede do compose.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream http://api-confectionery:8080;
        # proxy_pass via variável NÃO faz a substituição automática do prefixo da location (isso só
        # acontece com destino fixo terminado em "/") -- sem o rewrite, todo request vira GET / na
        # API, mesmo com o "/" no fim do proxy_pass acima. O rewrite remove /api/ manualmente antes.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html (react-router cuida do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
